</style></head><body><div class="toolbar"><b>FRAMEROOM · WIREFRAME</b><select id="screen-select" aria-label="Chọn màn hình"></select><button data-action="prev" aria-label="Màn hình trước">Trước</button><button data-action="next" aria-label="Màn hình sau">Sau</button><button data-action="reset-demo">Đặt lại mẫu</button><span id="stage-action"></span><small id="actor"></small></div><div id="frame" class="frame"></div><aside class="summary"><p><b>Prototype đồ án</b> · Dữ liệu minh họa, thao tác mô phỏng trên trình duyệt. Chọn màn hình ở thanh trên để xem các vai trò và trạng thái. Dùng Đặt lại mẫu để bắt đầu lại.</p><div id="description"></div></aside><div id="toast" class="toast" role="status" aria-live="polite"></div><script>const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(label,id,cls='')=>`<a class="${cls}" href="#${id}">${label}</a>`;
const btn=(label,action,primary=false)=>`<button type="button" data-action="${action}" class="${primary?'primary':''}">${label}</button>`;
const photo=(label='Ảnh',height=120)=>`<div class="photo" style="height:${height}px"><span>${label}</span></div>`;
let seq=0;
const field=(label,value='',type='text',required=false)=>{const id='f'+(++seq);return `<label class="field" for="${id}">${label}${required?' *':''}${type==='textarea'?`<textarea id="${id}" ${required?'required':''}>${E(value)}</textarea>`:`<input id="${id}" type="${type}" value="${E(value)}" ${required?'required':''}>`}</label>`};
const select=(label,values)=>`<label class="field">${label}<select>${values.map(v=>`<option>${v}</option>`).join('')}</select></label>`;
const check=(label,checked=false,extra='')=>`<label class="check"><input type="checkbox" ${checked?'checked':''} ${extra}>${label}</label>`;
const panel=(title,body,cls='')=>`<section class="panel ${cls}">${title?`<h2>${title}</h2>`:''}${body}</section>`;
const title=(name,sub='',actions='')=>`<div class="page-title"><div><h1>${name}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div><div class="row">${actions}</div></div>`;
const tabs=(items,active)=>`<nav class="tabs">${items.map(([l,id])=>link(l,id,id===active?'active':'')).join('')}</nav>`;
const chip=t=>`<span class="chip">${t}</span>`;
const note=t=>`<div class="note">${t}</div>`;
const drop=(label='Chọn ảnh hoặc kéo thả vào đây')=>`<div class="drop">${label}<br><small>Ảnh JPG, PNG, WebP · tối đa 50 MB mỗi tệp</small><br><input type="file" accept="image/jpeg,image/png,image/webp" multiple aria-label="${label}" data-upload></div>`;
const form=(body,label,action)=>`<form data-submit="${action}">${body}<div class="form-actions"><button class="primary" type="submit">${label}</button></div></form>`;
const table=(headers,rows)=>`<table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const genres=['Chân dung','Thời trang','Cưới','Gia đình','Sản phẩm','Ẩm thực','Sự kiện','Cosplay','Đồ uống','Kỷ yếu','Ngoại cảnh','Tết'];
const bookingTabs=[['Shoot Brief','brief'],['Shoot Room','room'],['Thư viện ảnh','gallery'],['Bàn giao','delivery'],['Trợ lý AI','project']];
const studioTabs=[['Tổng quan','studio'],['Thành viên','members'],['Dịch vụ','services'],['Tài nguyên','resources']];
const storeKey='frameroom-wireframe-v1';
let state={};try{state=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(state))}catch{}};
const account=(body,active='profile')=>`<div class="account"><aside class="account-nav">${[['Hồ sơ','profile'],['Studio','studios'],['Thông báo','notifications'],['Cài đặt','settings'],['Kiểm duyệt','moderation']].map(([l,id])=>link(l,id,active===id?'active':'')).join('')}${btn('Đăng xuất','logout')}</aside><div>${body}</div></div>`;
const timeline=(status)=>`<div class="timeline">${['Chờ xác nhận','Đã xác nhận','Đang thực hiện','Chọn ảnh','Đã bàn giao','Hoàn tất'].map(t=>`<span class="${status===t?'on':''}">${t}</span>`).join('<b>›</b>')}</div>`;
const bookHead=(status='Chờ xác nhận')=>title('Bộ ảnh chân dung tốt nghiệp','BK-024 · Mộc Studio · 05/12/2026, 08:00–10:00',chip(status))+timeline(status);
const authLayout=(body)=>`<div class="auth"><section class="auth-story"><p class="eyebrow">FRAMEROOM</p><h1>Không gian cho<br>câu chuyện của bạn</h1><p>Kết nối với nhiếp ảnh gia.<br>Cùng lên ý tưởng và lưu giữ khoảnh khắc.</p></section><section class="auth-form">${body}</section></div>`;
const galleryCards=(count=6,choose=false)=>`<div class="three">${Array.from({length:count},(_,i)=>`<article class="gallery-card">${link(photo('Ảnh '+String(i+1).padStart(2,'0'),118),'annotation')}<div class="row between"><small>IMG_${String(i+1).padStart(3,'0')}.jpg</small>${chip('Ảnh chụp')}</div>${choose?check('Chọn ảnh '+(i+1),false,`data-photo="${i+1}"`):''}</article>`).join('')}</div>`;
const briefInfo=()=>table(['Nội dung','Thỏa thuận'],[['Ý tưởng','Chân dung tốt nghiệp, ánh sáng tự nhiên'],['Địa điểm','Mộc Studio · TP. Hồ Chí Minh'],['Thời gian','05/12/2026 · 08:00–10:00'],['Phạm vi','1 người · 30 ảnh · 10 ảnh chỉnh sửa'],['Chỉnh sửa','Tối đa 2 vòng chọn lại'],['Ngân sách','2.000.000 ₫ · chưa gồm dịch vụ thêm']]);
const messageThread=(room=false)=>`<div class="thread"><div class="row between"><h2>${room?'Trao đổi trong BK-024':'Mộc Studio'}</h2>${chip(room?'Theo booking':'Trao đổi chung')}</div><div class="bubbles" id="messages"><div class="bubble">Mình muốn chụp chân dung tốt nghiệp, sáng ngày 05/12.<small>Khách hàng · 09:10</small></div><div class="bubble me">Studio còn lịch 08:00–10:00. Bạn gửi thêm ảnh tham khảo nhé.<small>Mộc Studio · 09:12</small></div>${(state.messages||[]).map(m=>`<div class="bubble me">${E(m)}<small>Vừa gửi · mô phỏng</small></div>`).join('')}</div><form class="composer" data-submit="send-message"><input aria-label="Nội dung tin nhắn" placeholder="Nhập tin nhắn…" required><button class="primary">Gửi</button></form><label class="field">Đính kèm tệp tham khảo<input type="file" data-upload accept="image/*,.pdf"></label></div>`;
const S=[];

screen('studio-create','Tạo studio mới','Nhiếp ảnh gia có hồ sơ hoạt động','UC4','pages/StudioPage.tsx studio creation modal','Tạo thông tin studio và thiết lập người tạo là quản lý ban đầu.','Tên studio, mô tả, địa điểm, liên hệ và thao tác tạo hoặc hủy.','Điền thông tin rồi tạo studio. Nếu hủy khi đã nhập dữ liệu, xác nhận bỏ thay đổi hoặc tiếp tục chỉnh sửa.',()=>`<div class="modal-card"><h1>Tạo studio</h1>${form(field('Tên studio','','text',true)+field('Mô tả','','textarea')+field('Địa điểm','','text',true)+field('Email liên hệ','','email',true),'Tạo studio','create-studio')}<div class="form-actions">${btn('Hủy','discard-studio')}</div></div>`);
window.SCREENS=S;
S.find(s=>s.id==='room').body=()=>bookHead(state.bookingStatus==='Đang thực hiện'?'Đang thực hiện':'Đã xác nhận')+tabs(bookingTabs,'room')+`<div class="row" style="margin-bottom:18px">${btn('Bắt đầu buổi chụp','start-shoot',true)}${link('Đề xuất thay đổi','scope','btn')}${link('Đổi người chụp','reassignment','btn')}${link('Đề nghị hủy','cancellation','btn')}${link('Tải ảnh để chọn','upload','btn')}</div><div class="split"><div class="panel">${messageThread(true)}</div><div class="stack">${panel('Quyết định',`<p>Trang phục tông sáng, nền trung tính.</p>${chip('Đang đề xuất')}<p style="margin-top:12px">${link('Xem và phản hồi','room-plan','text')}</p>`)}${panel('Mốc công việc',check('Duyệt ý tưởng',true,'data-milestone')+check('Chuẩn bị trang phục',false,'data-milestone')+check('Thực hiện buổi chụp',false,'data-milestone')+link('Thêm mốc công việc','room-plan','text'))}</div></div>`;
function header(s){const publicScreen=['home','genre','search','directory','provider','album','login','register','verify','reset','about'].includes(s.id);return `<header class="wire-header"><div class="header-top">${link('FrameRoom.','home','brand')}<div class="header-tools"><span>Tiếng Việt</span><form data-submit="global-search"><input aria-label="Tìm nhiếp ảnh gia hoặc phong cách" placeholder="Tìm nhiếp ảnh gia hoặc phong cách"><button type="submit">Tìm</button></form>${link('Thông báo','notifications')}${link(publicScreen?'Đăng nhập':'Tài khoản',publicScreen?'login':'profile','btn')}</div></div><div class="header-bottom"><nav>${link('Trang chủ','home')}${link('Khám phá','search')}${publicScreen?link('Thể loại','genre'):link('Lịch chụp','bookings')}${publicScreen?'':link('Dự án','projects')}${publicScreen?'':link('Portfolio','portfolios')}${link('Giới thiệu','about')}</nav>${link(publicScreen?'Tạo tài khoản':'Tin nhắn',publicScreen?'register':'messages')}</div></header>`;}
const capture=new URLSearchParams(location.search).has('capture');
if(capture)document.body.classList.add('capture');
const byId=id=>S.find(s=>s.id===id)||S[0];
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function go(id){if(location.hash==='#'+id)render();else location.hash=id;}
function setRegion(id,html){const el=document.getElementById(id);if(el)el.innerHTML=html;}
function render(){seq=0;const s=byId(location.hash.slice(1));document.title=`FrameRoom | ${s.name}`;document.getElementById('screen-select').value=s.id;document.getElementById('actor').textContent=`${s.actor} · ${s.uc}`;document.getElementById('stage-action').innerHTML=s.id==='verify'?btn('Mô phỏng email đã xác minh','verified'):'';document.getElementById('frame').innerHTML=header(s)+`<main class="${['home','login','register','verify','reset'].includes(s.id)?'':'content'}">${s.body()}</main>`;document.getElementById('description').innerHTML=`<b>${String(S.indexOf(s)+1).padStart(2,'0')} · ${s.name}</b><p><b>Mục đích:</b> ${s.purpose}</p><p><b>Hiển thị:</b> ${s.info}</p><p><b>Cách sử dụng:</b> ${s.use}</p>`;restoreDraft(s.id);window.scrollTo(0,0);if(s.id==='gallery'){setRegion('selection-count',`Đã chọn ${document.querySelectorAll('[data-photo]:checked').length} / 10`);const p=document.querySelector('#frame .row.between p');if(p)p.textContent=`Vòng ${state.round||1} · Tối đa 10 ảnh chỉnh sửa`;}}
function restoreDraft(id){const values=(state.drafts||{})[id];if(values)document.querySelectorAll('#frame input:not([type=file]):not([type=password]),#frame textarea,#frame select').forEach((el,i)=>{if(values[i]!==undefined){if(el.type==='checkbox')el.checked=values[i];else el.value=values[i]}});}
function remember(){const id=byId(location.hash.slice(1)).id;state.drafts=state.drafts||{};state.drafts[id]=Array.from(document.querySelectorAll('#frame input:not([type=file]):not([type=password]),#frame textarea,#frame select')).map(el=>el.type==='checkbox'?el.checked:el.value);save();}
document.getElementById('screen-select').innerHTML=S.map((s,i)=>`<option value="${s.id}">${String(i+1).padStart(2,'0')} · ${s.name}</option>`).join('');
document.getElementById('screen-select').addEventListener('change',e=>go(e.target.value));
window.addEventListener('hashchange',render);
document.addEventListener('input',e=>{if(e.target.closest('#frame')&&e.target.type!=='password')remember()});
document.addEventListener('change',e=>{if(e.target.matches('[data-photo]')){const count=document.querySelectorAll('[data-photo]:checked').length;setRegion('selection-count',`Đã chọn ${count} / 10`)}if(e.target.matches('[data-milestone]')){remember();toast('Đã cập nhật mốc công việc. Trạng thái booking không thay đổi.')}if(e.target.matches('[data-upload]')){const files=Array.from(e.target.files||[]);const invalid=files.some(f=>f.size>50*1024*1024||!(/\.(jpe?g|png|webp|pdf)$/i.test(f.name)));if(invalid){e.target.value='';toast('Tệp không hợp lệ hoặc vượt 50 MB. Vui lòng chọn lại.');return;}state.uploaded=files.map(f=>f.name);save();const summary=document.createElement('p');summary.className='status-banner';summary.textContent='Đã chọn: '+files.map(f=>f.name).join(', ')+' · Tệp chỉ dùng trong bản mẫu';e.target.parentElement.querySelector('.status-banner')?.remove();e.target.parentElement.append(summary);}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-submit]');if(!f)return;e.preventDefault();if(!f.reportValidity())return;const vals=Array.from(f.querySelectorAll('input:not([type=file]),textarea,select')).map(x=>x.type==='checkbox'?x.checked:x.value);const action=f.dataset.submit;
if(action==='global-search'){go('search');}
else if(action==='login'){state.loggedIn=true;const target=state.authNext||'bookings';delete state.authNext;save();go(target);toast('Đăng nhập mô phỏng thành công.');}
else if(action==='register'){if(vals[1]!==vals[2])return toast('Mật khẩu xác nhận chưa khớp.');if(vals[1].length<8)return toast('Mật khẩu cần ít nhất 8 ký tự.');state.email=vals[0];save();go('verify');}
else if(action==='reset-email'){f.innerHTML=note('Đã gửi liên kết khôi phục trong kịch bản mẫu.')+btn('Mô phỏng mở liên kết','reset-link');}
else if(action==='new-password'){if(vals[0]!==vals[1])return toast('Mật khẩu xác nhận chưa khớp.');if(vals[0].length<8)return toast('Mật khẩu cần ít nhất 8 ký tự.');go('login');toast('Đã đặt mật khẩu mới trong bản mẫu.');}
else if(action==='onboard'){state.loggedIn=true;save();go('profile');}
else if(action==='search'){const budget=f.querySelectorAll('select')[2].selectedIndex;const q=vals[0].trim();document.querySelectorAll('[data-result]').forEach(x=>x.classList.toggle('hidden',budget===1));setRegion('search-count',budget===1?'Không có kết quả':'3 kết quả phù hợp');setRegion('search-note',note(budget===1?'Không có nhà cung cấp trong mức giá này. Hãy tăng ngân sách hoặc xóa bộ lọc.':`Kết quả mẫu cho “${E(q||'Chân dung')}” · TP. Hồ Chí Minh`));}
else if(action==='filter-genre'||action==='filter-studio'){toast('Đã áp dụng bộ lọc cho bộ dữ liệu mẫu.');f.insertAdjacentHTML('beforeend','<p class="status-banner">Đang hiển thị các kết quả mẫu phù hợp.</p>');}
else if(action==='create-booking'){const dates=f.querySelectorAll('input[type=datetime-local]');if(Date.parse(dates[1].value)<=Date.parse(dates[0].value))return toast('Kết thúc phải sau thời điểm bắt đầu.');if(Date.parse(dates[0].value)<=Date.now())return toast('Hãy chọn thời gian trong tương lai.');const nums=Array.from(f.querySelectorAll('input[type=number]')).map(x=>+x.value);if(nums.some(n=>n<0)||nums[0]<1||nums[2]>nums[1])return toast('Số người phải dương và số ảnh chỉnh sửa không vượt tổng số ảnh.');state.bookingStatus='Chờ xác nhận';state.providerApproved=false;save();go('brief');toast('Đã tạo BK-024 và Brief v1 trong bản mẫu.');}
else if(action==='confirm-booking'){if(!state.providerApproved)return toast('Cần nhà cung cấp duyệt Brief trước khi xác nhận.');state.bookingStatus='Đã xác nhận';state.assignee=vals[0];save();go('room');}
else if(action==='propose-scope'){setRegion('scope-decision',panel('Phiên bản 2 đang chờ phía còn lại',`<p>Bên đề xuất đã duyệt. Phiên bản 1 vẫn có hiệu lực.</p><div class="row">${btn('Phía còn lại đồng ý','accept-scope',true)}${btn('Phía còn lại từ chối','reject-scope')}</div>`));}
else if(action==='propose-cancel'){setRegion('cancel-decision',`<hr class="divider"><p>Đã gửi đề nghị. Booking vẫn giữ trạng thái hiện tại.</p><h3>Phản hồi của phía còn lại</h3><div class="row">${btn('Đồng ý hủy','accept-cancel')}${btn('Không đồng ý','reject-cancel')}</div>`);f.querySelector('button').disabled=true;}
else if(action==='reassign'){state.assignee=vals[0];save();go('room');toast('Đã đổi người chụp; giữ nguyên Brief và lịch sử booking.');}
else if(action==='send-message'){state.messages=state.messages||[];state.messages.push(vals[0]);save();document.getElementById('messages').insertAdjacentHTML('beforeend',`<div class="bubble me">${E(vals[0])}<small>Vừa gửi · mô phỏng</small></div>`);f.reset();}
else if(action==='save-note'){document.getElementById('saved-notes').insertAdjacentHTML('beforeend',`<p class="status-banner">${state.pin?'Ghim mới':'Ghi chú chung'}: ${E(vals[0])}</p>`);f.reset();toast('Đã lưu chú thích trong phiên mẫu.');}
else if(action==='review'){state.review={rating:vals[0],comment:vals[1]};save();render();toast('Đã gửi một đánh giá cho BK-024.');}
else if(action==='invite'){setRegion('invite-result',note('Đã gửi lời mời đến Ngọc Anh · Đang chờ phản hồi.'));f.querySelector('button').disabled=true;}
else if(action==='new-decision'){document.getElementById('decision-list').insertAdjacentHTML('beforeend',`<div class="notice"><p>${E(vals[0])}</p>${chip('Đang đề xuất')}<div class="row">${btn('Đồng ý','decision:Đã đồng ý')}${btn('Từ chối','decision:Đã từ chối')}</div></div>`);f.reset();}
else if(action==='new-milestone'){document.getElementById('milestone-list').insertAdjacentHTML('beforeend',check(E(vals[0])+' · '+E(vals[1]),false,'data-milestone'));f.reset();}
else if(action==='rename-project'){state.projectTitle=vals[0];save();go('project');toast('Đã lưu tên và ý tưởng dự án.');}
else if(action==='create-studio'){state.studioName=vals[0];save();go('studio');toast('Đã tạo studio. Bạn là quản lý studio này.');}
else if(action==='add-resource'){f.insertAdjacentHTML('afterend',note('Đã thêm tài nguyên: '+E(vals[0])));f.reset();}
else if(action==='add-busy'){const d=f.querySelectorAll('[type=datetime-local]');if(Date.parse(d[1].value)<=Date.parse(d[0].value))return toast('Kết thúc phải sau thời điểm bắt đầu.');document.getElementById('busy-list').insertAdjacentHTML('beforeend',`<div class="list-row"><p>${E(vals[0])} – ${E(vals[1])} · ${E(vals[2])}</p>${btn('Xóa lịch bận','remove-busy')}</div>`);}
else if(action==='report-content'){f.innerHTML=note('Đã gửi báo cáo RPT-018 · Chờ xử lý. Nội dung vẫn giữ nguyên cho tới quyết định kiểm duyệt.');state.reportResolved='Chờ xử lý';save();}
else if(action==='save-service'){const n=Array.from(f.querySelectorAll('[type=number]')).map(x=>+x.value);if(n.some(x=>x<0)||n[1]<=0||n[3]>n[2])return toast('Giá, thời lượng và số lượng ảnh chưa hợp lệ.');remember();go('services');toast('Đã lưu gói dịch vụ.');}
else{remember();f.querySelector('button[type=submit],button.primary')?.insertAdjacentHTML('afterend','<span class="chip">Đã lưu trong bản mẫu</span>');toast('Đã lưu thay đổi trong bản mẫu.');}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='reset-demo'){localStorage.removeItem(storeKey);state={};render();toast('Đã đặt lại dữ liệu mẫu.');}
else if(a==='prev'||a==='next'){let i=S.indexOf(byId(location.hash.slice(1)));go(S[(i+(a==='next'?1:S.length-1))%S.length].id);}
else if(a==='resend'){b.disabled=true;b.textContent='Đã gửi lại email';toast('Mô phỏng gửi lại liên kết xác minh.');}
else if(a==='verified')go('onboarding');
else if(a==='logout'){state.loggedIn=false;save();go('login');}
else if(a==='reset-link'){b.parentElement.innerHTML=form(field('Mật khẩu mới','','password',true)+field('Xác nhận mật khẩu','','password',true),'Lưu mật khẩu mới','new-password');}
else if(a.startsWith('genre:')){setRegion('genre-label',E(a.slice(6)));state.genre=a.slice(6);save();}
else if(a==='approve-brief'){state.providerApproved=true;save();render();toast('Hai bên đã duyệt Brief v1. Có thể phân công.');}
else if(a==='cancel-pending'){const reason=prompt('Lý do hủy yêu cầu đang chờ:');if(reason?.trim()){state.bookingStatus='Đã hủy';save();go('bookings');toast('Đã hủy yêu cầu đang chờ. Không tạo Shoot Room.');}}
else if(a==='reject-booking'){const reason=prompt('Lý do từ chối yêu cầu:');if(reason?.trim()){state.bookingStatus='Bị từ chối';save();go('bookings');}}
else if(a==='start-shoot'){state.bookingStatus='Đang thực hiện';save();render();}
else if(a==='accept-scope'||a==='reject-scope'){setRegion('scope-decision',note(a==='accept-scope'?'Hai bên đã duyệt. Phiên bản 2 có hiệu lực; thời gian mới được kiểm tra xung đột trước khi áp dụng.':'Đề xuất đã bị từ chối. Phiên bản 1 tiếp tục có hiệu lực.'));}
else if(a==='accept-cancel'){state.bookingStatus='Đã hủy';save();go('bookings');}
else if(a==='reject-cancel'){setRegion('cancel-decision',note('Phía còn lại không đồng ý hủy. Booking vẫn được tiếp tục.'));}
else if(a==='sample-upload'){state.galleryUploaded=true;save();setRegion('upload-result',note('Đã thêm 30 ảnh xem trước mẫu.'));}
else if(a==='open-gallery'){if(!state.galleryUploaded&&!state.uploaded?.length)return toast('Vui lòng tải ảnh hoặc thêm ảnh mẫu trước.');state.bookingStatus='Chọn ảnh';save();go('gallery');}
else if(a==='ai-cull'){setRegion('upload-result',note('Gợi ý AI: giữ ảnh 01, 02, 03; loại ảnh 04 do nhòe. Cần người chụp duyệt kết quả.')+btn('Áp dụng gợi ý','apply-cull'));}
else if(a==='apply-cull'){state.galleryUploaded=true;save();setRegion('upload-result',note('Đã áp dụng gợi ý mẫu. Người chụp có thể mở vòng chọn.'));}
else if(a==='submit-selection'){const c=document.querySelectorAll('[data-photo]:checked').length;if(!c)return toast('Chọn ít nhất một ảnh trước khi gửi.');if(c>10)return toast('Vượt hạn mức 10 ảnh.');state.selectedCount=c;save();go('selection');}
else if(a==='request-revision'){if((state.round||1)>=3)return toast('Đã hết 2 vòng chọn lại.');setRegion('revision-decision',`<hr class="divider"><p>Đã gửi yêu cầu mở lại. Danh sách cũ vẫn được giữ.</p>${btn('Nhà cung cấp chấp nhận mở lại','reopen',true)}`);}
else if(a==='reopen'){state.round=(state.round||1)+1;state.drafts=state.drafts||{};delete state.drafts.gallery;save();go('gallery');toast('Đã mở vòng '+state.round);}
else if(a==='sample-delivery'){state.deliveryReady=true;save();setRegion('delivery-files',note('Đã thêm 10 tệp JPG chất lượng cao mẫu.'));}
else if(a==='mark-delivered'){if(!state.deliveryReady&&!state.uploaded?.length)return toast('Tải tệp cuối hoặc thêm tệp mẫu trước.');state.bookingStatus='Đã bàn giao';save();go('delivery');}
else if(a==='complete'){state.bookingStatus='Hoàn tất';save();go('review');}
else if(a==='download'){const blob=new Blob(['FrameRoom UI prototype\nTệp mô phỏng bàn giao BK-024. Không phải ảnh thật.'],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download='FrameRoom-tep-ban-giao-mau.txt';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
else if(a==='hidden-review'){state.reviewHidden=true;save();b.parentElement.insertAdjacentHTML('afterend',note('Đánh giá bị ẩn. Chỉnh lại nội dung rồi gửi xét duyệt trên cùng bản ghi.')+form(field('Nội dung sửa','','textarea',true),'Gửi xét duyệt lại','resubmit-review'));}
else if(a==='create-studio'){setRegion('studio-create',panel('Tạo studio mới',form(field('Tên studio','','text',true)+field('Mô tả','','textarea')+field('Địa điểm','','text',true)+field('Email liên hệ','','email',true),'Tạo studio','create-studio')));}
else if(a==='discard-studio'){if(confirm('Bỏ các thông tin studio chưa lưu?'))go('studios');}
else if(a==='delete-project'){if(confirm('Xóa dự án nháp này?')){state.projectTitle='Dự án mới';save();go('projects');toast('Dự án nháp mẫu đã được xóa.');}}
else if(a.startsWith('decision:')){const p=b.closest('.notice')||b.closest('.panel');p.querySelector('.chip').textContent=a.slice(9);b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);}
else if(a==='ai-preview'){setRegion('ai-status',note('Tác vụ mẫu hoàn tất. Bản đề xuất sẵn sàng để xem lại.'));}
else if(a==='accept-ai-image'){setRegion('ai-image-result',note('Đã chọn bản đề xuất. Ảnh gốc vẫn được giữ để đối chiếu.'));}
else if(a==='keep-original'){setRegion('ai-image-result',note('Giữ ảnh gốc; không áp dụng bản AI đề xuất.'));}
else if(a==='member-role'){setRegion('member-result',panel('Quyền trong studio',select('Vai trò',['Nhiếp ảnh gia','Quản lý'])+btn('Lưu quyền','save-role')));}
else if(a==='save-role'){setRegion('member-result',note('Đã lưu vai trò trong studio. Không thay đổi vai trò ở studio khác.'));}
else if(a==='remove-member'){setRegion('member-result',note('Không thể gỡ Quang Huy: đang phụ trách BK-024. Hãy phân công lại trước.')+link('Phân công lại','reassignment','btn'));}
else if(a==='accept-invite'||a==='decline-invite'){if(a==='decline-invite'&&!confirm('Xác nhận từ chối lời mời?'))return;state.invitation=a==='accept-invite'?'Đã chấp nhận':'Đã từ chối';save();setRegion('invitation-result',note(state.invitation+(a==='accept-invite'?'. Bạn đã trở thành thành viên.':'. Không tạo tư cách thành viên.')));}
else if(a==='visibility'){b.textContent=b.textContent==='Ẩn bộ ảnh'?'Xuất bản':'Ẩn bộ ảnh';b.closest('.panel').querySelector('.chip').textContent=b.textContent==='Ẩn bộ ảnh'?'Đã xuất bản':'Đã ẩn';}
else if(a==='publish-portfolio'){setRegion('portfolio-result',note('Đã xuất bản bộ ảnh mẫu lên hồ sơ công khai.')+link('Xem portfolio','album','btn'));}
else if(a==='hide-service'){state.serviceHidden=!state.serviceHidden;save();b.closest('tr').children[3].textContent=state.serviceHidden?'Đã ẩn':'Công khai';b.textContent=state.serviceHidden?'Công khai lại':'Ngừng công khai';}
else if(a==='edit-addon'){b.closest('.list-row').insertAdjacentHTML('afterend',form(field('Tên dịch vụ thêm','Trang điểm','text',true)+field('Giá (₫)','500000','number',true)+select('Gói áp dụng',['Chân dung cá nhân','Chân dung mở rộng']),'Lưu dịch vụ thêm','save-addon'));}
else if(a==='new-resource'){setRegion('resource-form',panel('Thêm tài nguyên',form(field('Tên tài nguyên','','text',true)+select('Loại',['Phòng chụp','Thiết bị']),'Thêm tài nguyên','add-resource')));}
else if(a==='toggle-resource'){const td=b.closest('tr').children[2];td.textContent=td.textContent==='Hoạt động'?'Ngừng sử dụng':'Hoạt động';b.textContent=td.textContent==='Hoạt động'?'Ngừng sử dụng':'Kích hoạt';}
else if(a==='remove-busy'){if(confirm('Xóa khoảng bận này?'))b.closest('.list-row').remove();}
else if(a==='read-notifications'){document.querySelectorAll('.list-row small').forEach(x=>x.textContent='Hôm nay · Đã đọc');toast('Đã đánh dấu các thông báo đã đọc.');}
else if(a.startsWith('moderate:')){const reason=document.querySelector('#frame textarea');if(!reason.value.trim()){reason.focus();return toast('Vui lòng nhập lý do quyết định.');}state.reportResolved=a.slice(9);save();setRegion('moderation-result',note('Đã ghi quyết định: '+E(a.slice(9))+'. Lịch sử và bản ghi nội dung được giữ.'));}
else if(a==='hold'||a==='release-hold'){const reason=document.querySelector('#frame textarea');if(!reason.value.trim())return toast('Vui lòng nhập lý do quản trị.');state.hold=a==='hold';save();setRegion('hold-result',note(state.hold?'Đã tạm dừng bộ đếm. Booking vẫn ở Đã bàn giao.':'Đã gỡ giữ. Bộ đếm tiếp tục từ 144 giờ còn lại.'));}
else if(a==='clear-search'){document.querySelectorAll('[data-result]').forEach(x=>x.classList.remove('hidden'));document.querySelectorAll('.search-sidebar select').forEach(x=>x.selectedIndex=0);setRegion('search-count','3 kết quả phù hợp');setRegion('search-note','');}
else if(a==='image-search'){setRegion('search-note',note('Kết quả tìm phong cách mẫu: chân dung, ánh sáng tự nhiên. Khi AI không khả dụng, dùng bộ lọc cơ bản.'));}
else if(a.startsWith('preview:')){const d=document.createElement('dialog');d.innerHTML=photo('Ảnh '+a.slice(8),400)+`<form method="dialog"><button>Đóng</button></form>`;document.body.append(d);d.showModal();d.addEventListener('close',()=>d.remove());}
else if(a.startsWith('provider-tab:')){const t=a.slice(13);setRegion('provider-panel',t==='portfolio'?`<div class="two">${link(photo('Chân dung tự nhiên',180),'album')}${link(photo('Chân dung tốt nghiệp',180),'album')}</div>`:t==='about'?'<h2>Giới thiệu Mộc Studio</h2><p>Studio chuyên chụp chân dung cá nhân, gia đình và sự kiện tại TP. Hồ Chí Minh.</p><p>Thời gian hoạt động: 08:00–18:00.</p>':`<h2>Đánh giá 4,8 / 5</h2><p>“Trao đổi rõ ràng, bàn giao đúng hẹn.”</p><small>Khách hàng đã hoàn tất booking</small><p>${link('Báo cáo đánh giá','report')}</p>`);}
else if(a==='new-project'){const name=prompt('Tên dự án mới:');if(name?.trim()){state.projectTitle=name.trim();save();go('project');}}
else if(a.startsWith('project-tab:')){const t=a.slice(12);if(t==='brief')render();else if(t==='concept')setRegion('project-panel',panel('Ảnh concept',field('Mô tả concept','Chân dung tốt nghiệp, nền trơn, ánh sáng cửa sổ','textarea')+btn('Tạo concept','generate-concept',true)+`<div id="concept-results"></div>`));else if(t==='assistant')setRegion('project-panel',panel('Trợ lý AI',field('Yêu cầu','Gợi ý danh sách cảnh chụp cho buổi chân dung 2 giờ.','textarea')+btn('Gửi yêu cầu','ask-ai',true)+`<div id="assistant-result"></div>`));else setRegion('project-panel',table(['Tác vụ','Trạng thái','Thao tác'],[['Tạo concept','Hoàn tất',btn('Xem kết quả','generate-concept')],['Lọc ảnh','Thất bại',btn('Thử lại','retry')]]));}
else if(a==='generate-concept'){setRegion('concept-results',`<hr class="divider"><div class="three">${[1,2,3].map(i=>`<div>${photo('Concept AI '+i,150)}${check('Chọn concept '+i)}</div>`).join('')}</div>${btn('Áp dụng concept đã chọn','apply-concept')}`);}
else if(a==='apply-concept'){toast('Đã thêm concept vào tham khảo của dự án.');b.textContent='Đã áp dụng';b.disabled=true;}
else if(a==='ask-ai'){setRegion('assistant-result',note('Gợi ý: chân dung gần, toàn thân và ảnh cầm bằng tốt nghiệp. Đây là kết quả mô phỏng cần người dùng duyệt.')+btn('Xác nhận áp dụng vào Brief','apply-ai',true));}
else if(a==='apply-ai'){setRegion('assistant-result',note('Đã áp dụng gợi ý vào bản nháp Brief. Chưa tạo booking.'));}
else if(a==='retry'){b.textContent='Đã thử lại';b.insertAdjacentHTML('afterend','<p class="status-banner">Dữ liệu mẫu đã tải thành công.</p>');}
});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&!state.loggedIn&&location.hash==='#provider'&&['#messages','#booking-new'].includes(a.getAttribute('href'))){e.preventDefault();state.authNext=a.getAttribute('href').slice(1);save();go('login');toast('Đăng nhập để tiếp tục thao tác đã chọn.');}const area=e.target.closest('#pin-stage');if(area){const r=area.getBoundingClientRect();const x=((e.clientX-r.left)/r.width)*100,y=((e.clientY-r.top)/r.height)*100;state.pin={x,y};area.querySelector('[data-new-pin]')?.remove();area.insertAdjacentHTML('beforeend',`<i class="pin" data-new-pin style="left:${x}%;top:${y}%">2</i>`);toast('Đã đặt ghim. Nhập ghi chú để lưu.');}});
render();
</script></body></html>
